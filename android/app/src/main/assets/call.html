<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<!-- Habit AI calls: one WebRTC call inside the app's call screen (CallActivity). The screen talks to this page through
     window.Habit (ready, local, state, log); the page answers through start, remoteAnswer, setMute, setCam, flip, hangup.
     No ICE "trickle": the offer and answer carry all the ways to reach the phone, so only 2 notes go through Habit Chat. -->
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#remote{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
#local{position:fixed;right:14px;top:96px;width:30vw;max-width:160px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;
  border:2px solid rgba(255,255,255,.75);background:#111;transform:scaleX(-1);display:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
</style></head><body>
<video id="remote" autoplay playsinline></video>
<video id="local" autoplay playsinline muted></video>
<audio id="sound" autoplay></audio>
<script>
"use strict";
const H = window.Habit || { ready() {}, local() {}, state() {}, log() {} };
const $ = id => document.getElementById(id);
let pc = null, stream = null, cfg = null, facing = "user", over = false, last = "";

function log(s) { try { H.log(String(s)); } catch (e) { } }
function state(s) { if (s === last) return; last = s; try { H.state(s); } catch (e) { } }

function media(video) {
  return navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
    video: video ? { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24, max: 30 } } : false,
  });
}

// a clearer voice: Opus (the voice codec) up to 40 kb/s, with loss protection (FEC, so a lost bit of sound is rebuilt
// instead of cut), mono. Each phone asks this of the other in its own offer / answer.
function tuneOpus(sdp) {
  return sdp.replace(/a=fmtp:(\d+) ([^\r\n]*)\r\n/g, (line, pt, params) => {
    if (!new RegExp("a=rtpmap:" + pt + " opus/48000", "i").test(sdp)) return line;
    const p = {};
    params.split(";").map(x => x.trim()).filter(Boolean).forEach(x => { const [k, v] = x.split("="); p[k] = v; });
    Object.assign(p, { minptime: "10", useinbandfec: "1", usedtx: "0", stereo: "0", "sprop-stereo": "0", maxaveragebitrate: "40000", maxplaybackrate: "48000" });
    return "a=fmtp:" + pt + " " + Object.entries(p).map(([k, v]) => k + "=" + v).join(";") + "\r\n";
  });
}
// the voice goes first on a busy network
function voiceFirst() {
  pc.getSenders().forEach(snd => {
    if (!snd.track || snd.track.kind !== "audio") return;
    try {
      const p = snd.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      p.encodings[0].maxBitrate = 40000; p.encodings[0].priority = "high"; p.encodings[0].networkPriority = "high";
      snd.setParameters(p).catch(e => log("voiceFirst: " + e));
    } catch (e) { log("voiceFirst: " + e); }
  });
}

// waits until the phone knows all the ways to be reached (or [ms], whatever comes first)
function gathered(ms) {
  return new Promise(done => {
    if (pc.iceGatheringState === "complete") return done();
    const t = setTimeout(done, ms);
    pc.addEventListener("icegatheringstatechange", () => { if (pc.iceGatheringState === "complete") { clearTimeout(t); done(); } });
  });
}

async function start(c) {
  if (pc) return;
  cfg = c;
  try {
    pc = new RTCPeerConnection({ iceServers: c.ice || [], iceCandidatePoolSize: 2, bundlePolicy: "max-bundle" });
    pc.ontrack = e => {
      // a little more sound kept ready (about 0.1 s), so a jumpy mobile network doesn't cut the voice
      try { if (e.receiver && "jitterBufferTarget" in e.receiver) e.receiver.jitterBufferTarget = 100; else if (e.receiver) e.receiver.playoutDelayHint = 0.1; } catch (x) { }
      const s = e.streams && e.streams[0] ? e.streams[0] : new MediaStream([e.track]);
      if (cfg.video) { const v = $("remote"); if (v.srcObject !== s) v.srcObject = s; v.style.display = "block"; }
      else { const a = $("sound"); if (a.srcObject !== s) a.srcObject = s; }
    };
    pc.onconnectionstatechange = () => { if (!over) state(pc.connectionState); };
    pc.oniceconnectionstatechange = () => {
      if (over) return;
      const s = pc.iceConnectionState;
      if (s === "failed") state("failed");
      else if (s === "disconnected") state("reconnecting");
      else if (s === "connected" || s === "completed") state("connected");
    };
    stream = await media(!!c.video);
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
    if (c.video) { const l = $("local"); l.srcObject = stream; l.style.display = "block"; }
    state("media");
    if (c.role === "caller") {
      const offer = await pc.createOffer();
      await pc.setLocalDescription({ type: "offer", sdp: tuneOpus(offer.sdp) });
      voiceFirst();
      await gathered(c.wait || 4000);
      H.local("offer", pc.localDescription.sdp);
    } else {
      await pc.setRemoteDescription({ type: "offer", sdp: c.offer });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription({ type: "answer", sdp: tuneOpus(answer.sdp) });
      voiceFirst();
      await gathered(c.wait || 4000);
      H.local("answer", pc.localDescription.sdp);
    }
  } catch (e) {
    log("start: " + (e && (e.name + " " + e.message)));
    state("error:" + (e && e.name ? e.name : "Error"));
  }
}

async function remoteAnswer(sdp) {
  try { if (pc && !pc.currentRemoteDescription) await pc.setRemoteDescription({ type: "answer", sdp }); }
  catch (e) { log("answer: " + e); state("error:" + (e && e.name ? e.name : "Error")); }
}

function setMute(m) { if (stream) stream.getAudioTracks().forEach(t => { t.enabled = !m; }); }

function setCam(on) {
  if (stream) stream.getVideoTracks().forEach(t => { t.enabled = !!on; });
  $("local").style.display = on && cfg && cfg.video ? "block" : "none";
}

// front ↔ back camera (the old camera is closed first: many phones can't open two at once)
async function flip() {
  if (!stream || !cfg || !cfg.video) return;
  const old = stream.getVideoTracks()[0];
  facing = facing === "user" ? "environment" : "user";
  try {
    if (old) { old.stop(); stream.removeTrack(old); }
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } } });
    const nt = s.getVideoTracks()[0];
    const sender = pc.getSenders().find(x => x.track === null || (x.track && x.track.kind === "video"));
    if (sender) await sender.replaceTrack(nt);
    stream.addTrack(nt);
    const l = $("local"); l.srcObject = stream; l.style.transform = facing === "user" ? "scaleX(-1)" : "none";
  } catch (e) { log("flip: " + e); }
}

function hangup() {
  over = true;
  try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch (e) { }
  try { if (pc) pc.close(); } catch (e) { }
}

// for the screen: is sound/video coming in? (bytes so far)
async function stats() {
  if (!pc) return "{}";
  let inA = 0, inV = 0, rtt = 0, relay = false;
  try {
    (await pc.getStats()).forEach(r => {
      if (r.type === "inbound-rtp" && r.kind === "audio") inA += r.bytesReceived || 0;
      if (r.type === "inbound-rtp" && r.kind === "video") inV += r.bytesReceived || 0;
      if (r.type === "candidate-pair" && r.state === "succeeded" && r.nominated) { rtt = r.currentRoundTripTime || rtt; }
      if (r.type === "local-candidate" && r.candidateType === "relay") relay = true;
    });
  } catch (e) { }
  return JSON.stringify({ inA, inV, rtt, relay });
}

window.addEventListener("load", () => { try { H.ready(); } catch (e) { } });
</script>
</body></html>
