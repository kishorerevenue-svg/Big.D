<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Games</title>
<style>
:root {
  --bg: #F5F2FD; --card: #FFFFFF; --txt: #1D1238; --sub: #675F82; --line: #E6E0F7;
  --pri: #6D28D9; --pri-txt: #5B21B6; --soft: #EAE2FD; --acc: #F59E0B; --acc-soft: #FFEFD0;
  --g1: #5B21B6; --g2: #8B5CF6; --good: #1D8A5B; --good-soft: #DFF3E8; --bad: #C63B3F; --bad-soft: #FBE3E3;
  --shadow: 0 6px 18px rgba(29, 18, 56, .08); --why-txt: #6B4400; --gold-txt: #8A5300;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--txt); }
body { font-family: "Noto Sans Telugu", "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.45;
  min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); overflow-x: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.hero { background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 22px;
  border-radius: 0 0 26px 26px; position: relative; }
.bar { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.bar h1 { font-size: 20px; margin: 0; flex: 1; font-weight: 700; letter-spacing: .2px; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.16); display: grid; place-items: center; font-size: 20px; flex: none; }
.icon-btn:active { background: rgba(255,255,255,.28); }
.pet { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.pet .face { font-size: 44px; width: 64px; height: 64px; border-radius: 20px; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none;
  transition: transform .25s; }
.pet .face.jump { animation: jump .5s; }
@keyframes jump { 30% { transform: translateY(-10px) scale(1.06); } 60% { transform: translateY(0) scale(.98); } }
.pet .face.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.pet .talk { background: var(--card); color: var(--txt); border-radius: 16px 16px 16px 4px; padding: 10px 14px; font-size: 15px; box-shadow: var(--shadow); flex: 1; min-height: 44px; }
main { padding: 16px; max-width: 560px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px 14px; text-align: left; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 6px; min-height: 132px; }
.tile:active { transform: scale(.98); }
.tile .em { width: 48px; height: 48px; border-radius: 15px; background: var(--soft); display: grid; place-items: center; font-size: 26px; }
.tile b { font-size: 17px; }
.tile small { color: var(--sub); font-size: 13.5px; }
.tile.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px 16px; box-shadow: var(--shadow); }
.meta { display: flex; justify-content: space-between; align-items: center; color: var(--sub); font-size: 14px; margin-bottom: 10px; gap: 8px; }
.chip { background: var(--soft); color: var(--pri-txt); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.chip.gold { background: var(--acc-soft); color: var(--gold-txt); }
.qtext { font-size: 19px; font-weight: 700; margin: 4px 0 14px; }
.opts { display: grid; gap: 10px; }
.opt { width: 100%; text-align: left; padding: 14px 16px; min-height: 52px; border-radius: 16px; background: var(--bg); border: 1.5px solid var(--line); font-size: 16.5px; }
.opt:active { transform: scale(.99); }
.opt.right { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 700; }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.why { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--acc-soft); color: var(--why-txt); font-size: 15px; }
.row { display: flex; gap: 10px; margin-top: 14px; }
.btn { flex: 1; min-height: 50px; border-radius: 16px; background: var(--pri); color: #fff; font-weight: 700; font-size: 16.5px; padding: 0 16px; }
.btn.soft { background: var(--soft); color: var(--pri-txt); }
.btn:active { filter: brightness(.95); transform: scale(.99); }
.riddle { font-size: 20px; font-weight: 700; margin: 6px 0 4px; }
.answer { margin-top: 14px; padding: 14px; border-radius: 16px; background: var(--good-soft); color: var(--good); font-size: 19px; font-weight: 700; text-align: center; }
.hint { margin-top: 12px; color: var(--sub); font-size: 15px; }
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mc { aspect-ratio: 1 / 1; border-radius: 16px; background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; font-size: 30px; display: grid; place-items: center;
  box-shadow: var(--shadow); transition: transform .2s; }
.mc .f { display: none; }
.mc.open, .mc.done { background: var(--card); border: 1.5px solid var(--line); }
.mc.open .f, .mc.done .f { display: block; }
.mc.open .b, .mc.done .b { display: none; }
.mc.done { opacity: .55; }
.mc .b { font-size: 22px; opacity: .85; }
.ttt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 330px; margin: 6px auto 0; }
.cell { aspect-ratio: 1 / 1; border-radius: 18px; background: var(--bg); border: 1.5px solid var(--line); font-size: 44px; font-weight: 800; display: grid; place-items: center; }
.cell.x { color: var(--pri); }
.cell.o { color: var(--acc); }
.cell.win { background: var(--good-soft); border-color: var(--good); }
.score { display: flex; justify-content: center; gap: 10px; margin: 2px 0 12px; flex-wrap: wrap; }
.big { font-size: 40px; text-align: center; margin: 4px 0; }
.center { text-align: center; }
.result { font-size: 22px; font-weight: 800; text-align: center; margin: 8px 0 2px; }
.sub { color: var(--sub); text-align: center; font-size: 15px; }
.math { font-size: 40px; font-weight: 800; text-align: center; margin: 10px 0 16px; letter-spacing: 1px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opts.two .opt { text-align: center; font-size: 22px; font-weight: 700; }
.foot { color: var(--sub); font-size: 13px; text-align: center; margin: 18px 0 8px; }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="hero">
  <div class="bar">
    <button class="icon-btn" id="back" aria-label="Back">←</button>
    <h1 id="title">Games</h1>
    <button class="icon-btn" id="voice" aria-label="Voice on or off">🔊</button>
  </div>
  <div class="pet">
    <div class="face" id="face">🐶</div>
    <div class="talk" id="talk">…</div>
  </div>
</div>
<main id="app"></main>

<script>
"use strict";
// ---------- settings from the app (language, colours, the pet) ----------
const Q = new URLSearchParams(location.search);
const LANG = Q.get("lang") === "te" ? "te" : "en";
const T = (en, te) => (LANG === "te" ? te : en);
const PETS = { puppy: "🐶", kitten: "🐱", bunny: "🐰", panda: "🐼", bear: "🧸", fox: "🦊", robot: "🤖", parrot: "🦜", mochi: "🍡", kitty: "😺", chameleon: "🦎" };
const PET = PETS[Q.get("pet")] || "🐶";
document.documentElement.lang = LANG;
const hex = v => (v && /^[0-9a-fA-F]{6}$/.test(v) ? "#" + v : null);
for (const [k, css] of [["bg", "--bg"], ["card", "--card"], ["txt", "--txt"], ["sub", "--sub"], ["line", "--line"], ["pri", "--pri"], ["prit", "--pri-txt"],
  ["soft", "--soft"], ["acc", "--acc"], ["g1", "--g1"], ["g2", "--g2"]]) { const c = hex(Q.get(k)); if (c) document.documentElement.style.setProperty(css, c); }
if (Q.get("dark") === "1") {
  const s = document.documentElement.style;
  s.setProperty("--good-soft", "#16392A"); s.setProperty("--good", "#4CC38A"); s.setProperty("--bad-soft", "#3D1C22"); s.setProperty("--bad", "#FF7B7B");
  s.setProperty("--acc-soft", "#3A2E14"); s.setProperty("--shadow", "0 6px 18px rgba(0,0,0,.35)");
  s.setProperty("--why-txt", "#F2D49B"); s.setProperty("--gold-txt", "#F2B84B");
}

// ---------- the app's voice (the page asks the app to say things; nothing leaves the phone) ----------
const app = window.HabitApp;
let voiceOn = true;
try { voiceOn = localStorage.getItem("games:voice") !== "0"; } catch (e) { }
const voiceBtn = document.getElementById("voice");
function showVoice() { voiceBtn.textContent = voiceOn ? "🔊" : "🔇"; }
showVoice();
voiceBtn.onclick = () => { voiceOn = !voiceOn; showVoice(); try { localStorage.setItem("games:voice", voiceOn ? "1" : "0"); } catch (e) { } if (!voiceOn) hush(); };
function say(text) { if (voiceOn && app && app.say) { try { app.say(String(text).replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ""), LANG); } catch (e) { } } }
function hush() { if (app && app.hush) { try { app.hush(); } catch (e) { } } }

// ---------- the pet on top ----------
const face = document.getElementById("face"), talk = document.getElementById("talk");
face.textContent = PET;
function petSays(text, mood, speak = false) {
  talk.textContent = text;
  face.classList.remove("jump", "shake"); void face.offsetWidth;
  if (mood === "happy") face.classList.add("jump");
  if (mood === "oops") face.classList.add("shake");
  if (speak) say(text);
}
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PRAISE = () => pick(T(["Super! 🎉", "Correct! 👏", "Wow, you know it! 🌟", "Well done! 💪"], ["సూపర్! 🎉", "సరైన జవాబు! 👏", "అబ్బా, భలే తెలుసు! 🌟", "శభాష్! 💪"]));
const OOPS = () => pick(T(["Oops! 🙈", "Not this one!", "Almost! 😅"], ["అయ్యో! 🙈", "ఇది కాదు!", "కొంచెంలో తప్పింది! 😅"]));
function best(key, value, more = true) {   // the best score is kept on this phone only
  let b = null;
  try { b = JSON.parse(localStorage.getItem("games:best:" + key)); } catch (e) { }
  if (value != null && (b == null || (more ? value > b : value < b))) { b = value; try { localStorage.setItem("games:best:" + key, JSON.stringify(b)); } catch (e) { } }
  return b;
}
const $ = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const main = document.getElementById("app"), title = document.getElementById("title");
let leave = null;   // what the back button does inside a game

// ---------- playing by voice: the floating pet passes on what it heard (window.voice), and the page tells the pet what is
// on the screen (app.state), so the pet's brain knows the question too ----------
let CUR = { game: "home" };
function setState(text) { if (app && app.state) { try { app.state(String(text).slice(0, 1400)); } catch (e) { } } }
const norm = s => String(s).toLowerCase().replace(/[“”"'’`.,!?;:()\[\]\-–—…/]/g, " ").replace(/\s+/g, " ").trim();
const SMALL = new Set(["a", "an", "the", "of", "or", "and", "it", "is", "its", "your", "my", "to", "ఒక", "లేదా", "అది", "ఇది"]);
const sameW = (a, b) => a === b || (Math.min(a.length, b.length) >= 3 && (a.startsWith(b) || b.startsWith(a)));
/** How much of [target]'s main words are in what they said (0 to 1). */
function fit(heard, target) {
  const t = norm(target).split(" ").filter(w => w && !SMALL.has(w) && (w.length > 1 || /\d/.test(w)));
  const h = norm(heard).split(" ").filter(Boolean);
  if (!t.length || !h.length) return 0;
  return t.filter(w => h.some(x => sameW(x, w))).length / t.length;
}
/** Like fit(), counting every word (for choices that differ only by a short word: "Vitamin A" / "Vitamin D"). */
function fitAll(heard, target) {
  const t = norm(target).split(" ").filter(Boolean), h = norm(heard).split(" ").filter(Boolean);
  if (!t.length || !h.length) return 0;
  return t.filter(w => h.some(x => x === w || (Math.min(x.length, w.length) >= 3 && sameW(x, w)))).length / t.length;
}
/** True when what they said has at least half of the main words of [target]. */
const says = (heard, target) => fit(heard, target) >= 0.5;
const ORD = [[/\b(first|one|1|a)\b|మొదటి|మొదటిది|ఒకటి|ఒకటో/, 0], [/\b(second|two|2|b)\b|రెండో|రెండవ|రెండు/, 1], [/\b(third|three|3|c)\b|మూడో|మూడవ|మూడు/, 2], [/\b(fourth|four|4|d)\b|నాలుగో|నాలుగవ|నాలుగు/, 3]];
const CMD = {
  next: /\b(next|skip|go on|another)\b|తరువాత|తర్వాత|నెక్స్ట్|ఇంకోటి|ఇంకొకటి|మరొకటి|వేరేది/,
  answer: /\b(show|tell|say)( me)?( the)? answer\b|జవాబు చెప్పు|జవాబు చూపించు|ఆన్సర్ చెప్పు|చెప్పేయ్/,
  hint: /\b(hint|clue)\b|క్లూ|సూచన|హింట్/,
  again: /\b(again|play again|restart|one more)\b|మళ్ళీ|మళ్లీ|ఇంకోసారి/,
  list: /\b(other games?|games list|all games|another game|menu)\b|ఇతర ఆట|ఆటల లిస్ట్|వేరే ఆట/,
  close: /^(close|exit|quit|stop (the )?game|close (the )?game)$|ఆట ఆపు|ఆట మూసేయ్|ఆటలు మూసేయ్|బయటకు వెళ్ళు/,
  dontknow: /\b(don ?t know|do not know|no idea|give up)\b|తెలియదు|తెలీదు/,
  yes: /^(yes|yeah|ok|okay|sure|got it)$|^(అవును|సరే|ఓకే|తెలిసింది)$/
};
function gameFrom(h) {
  if (/quiz|క్విజ్/.test(h)) return "quiz";
  if (/riddle|పొడుపు/.test(h)) return "riddles";
  if (/memory|cards?\b|జ్ఞాపక|కార్డు/.test(h)) return "memory";
  if (/tic ?tac|\bx ?o\b|ఎక్స్ ఓ|xo/.test(h)) return "tictactoe";
  if (/\bmaths?\b|numbers? game|లెక్క/.test(h)) return "maths";
  return null;
}
/** What the pet heard; true when the game used it. */
window.voice = function (text) {
  const h = norm(text);
  if (!h) return false;
  if (CMD.close.test(h)) { say(T("Okay, see you! 👋", "సరే, మళ్ళీ ఆడదాం! 👋")); setTimeout(() => { if (app && app.close) app.close(); }, 900); return true; }
  if (CMD.list.test(h)) { home(); say(T("Pick a game: quiz, riddles, memory cards, tic-tac-toe or maths.", "ఒక ఆట చెప్పండి: క్విజ్, పొడుపు కథలు, జ్ఞాపకశక్తి ఆట, X-O ఆట, లెక్కల ఆట.")); return true; }
  const g = gameFrom(h);
  if (g && (CUR.game === "home" || /\bplay\b|ఆడ/.test(h))) { GAMES[g].run(); return true; }
  return CUR.voice ? !!CUR.voice(h) : false;
};

// ---------- 1. quiz ----------
const QUIZ = [
  { q: ["What is the capital of India?", "భారతదేశ రాజధాని ఏది?"], o: [["Mumbai", "ముంబై"], ["New Delhi", "న్యూఢిల్లీ"], ["Kolkata", "కోల్‌కతా"], ["Chennai", "చెన్నై"]], a: 1,
    why: ["New Delhi is the capital of India.", "న్యూఢిల్లీ మన దేశ రాజధాని."] },
  { q: ["What is India's national animal?", "భారతదేశ జాతీయ జంతువు ఏది?"], o: [["Lion", "సింహం"], ["Tiger", "పులి"], ["Elephant", "ఏనుగు"], ["Deer", "జింక"]], a: 1,
    why: ["The tiger (Bengal tiger) is India's national animal.", "పులి (బెంగాల్ టైగర్) మన జాతీయ జంతువు."] },
  { q: ["What is India's national bird?", "భారతదేశ జాతీయ పక్షి ఏది?"], o: [["Parrot", "చిలుక"], ["Crow", "కాకి"], ["Peacock", "నెమలి"], ["Pigeon", "పావురం"]], a: 2,
    why: ["The peacock is India's national bird.", "నెమలి మన జాతీయ పక్షి."] },
  { q: ["What is India's national fruit?", "భారతదేశ జాతీయ పండు ఏది?"], o: [["Banana", "అరటి"], ["Mango", "మామిడి"], ["Apple", "ఆపిల్"], ["Guava", "జామ"]], a: 1,
    why: ["The mango is India's national fruit.", "మామిడి మన జాతీయ పండు."] },
  { q: ["Who wrote India's national anthem, \"Jana Gana Mana\"?", "మన జాతీయ గీతం \"జన గణ మన\" ఎవరు రాశారు?"],
    o: [["Rabindranath Tagore", "రవీంద్రనాథ్ ఠాగూర్"], ["Bankim Chandra Chatterjee", "బంకిం చంద్ర ఛటర్జీ"], ["Sarojini Naidu", "సరోజినీ నాయుడు"], ["Subramania Bharati", "సుబ్రహ్మణ్య భారతి"]], a: 0,
    why: ["Rabindranath Tagore wrote \"Jana Gana Mana\".", "\"జన గణ మన\" రాసింది రవీంద్రనాథ్ ఠాగూర్."] },
  { q: ["When is India's Independence Day?", "భారత స్వాతంత్ర్య దినోత్సవం ఎప్పుడు?"], o: [["January 26", "జనవరి 26"], ["August 15", "ఆగస్టు 15"], ["October 2", "అక్టోబర్ 2"], ["November 14", "నవంబర్ 14"]], a: 1,
    why: ["India became independent on 15 August 1947.", "1947 ఆగస్టు 15న మన దేశానికి స్వాతంత్ర్యం వచ్చింది."] },
  { q: ["When is Republic Day?", "గణతంత్ర దినోత్సవం ఎప్పుడు?"], o: [["January 26", "జనవరి 26"], ["August 15", "ఆగస్టు 15"], ["October 2", "అక్టోబర్ 2"], ["December 25", "డిసెంబర్ 25"]], a: 0,
    why: ["India's Constitution came into force on 26 January 1950.", "1950 జనవరి 26న మన రాజ్యాంగం అమల్లోకి వచ్చింది."] },
  { q: ["Gandhi Jayanti is on which day?", "గాంధీ జయంతి ఏ రోజు?"], o: [["October 2", "అక్టోబర్ 2"], ["November 14", "నవంబర్ 14"], ["January 30", "జనవరి 30"], ["September 5", "సెప్టెంబర్ 5"]], a: 0,
    why: ["Mahatma Gandhi was born on 2 October 1869.", "మహాత్మా గాంధీ 1869 అక్టోబర్ 2న పుట్టారు."] },
  { q: ["Children's Day in India is on…", "మన దేశంలో బాలల దినోత్సవం…"], o: [["November 14", "నవంబర్ 14"], ["June 1", "జూన్ 1"], ["September 5", "సెప్టెంబర్ 5"], ["August 29", "ఆగస్టు 29"]], a: 0,

function quiz() {
  title.textContent = T("Quiz", "క్విజ్");
  const round = shuffle(QUIZ).slice(0, 10);
  let i = 0, score = 0;
  leave = home;
  function show() {
    if (i >= round.length) return done();
    const it = round[i], L = LANG === "te" ? 1 : 0;
    const order = shuffle([0, 1, 2, 3]);
    const card = $(`<div class="card"><div class="meta"><span class="chip">${T("Question", "ప్రశ్న")} ${i + 1} / ${round.length}</span><span class="chip gold">⭐ ${score}</span></div>
      <div class="qtext">${esc(it.q[L])}</div><div class="opts"></div></div>`);
    const opts = card.querySelector(".opts");
    let answered = false;
    function after() {
      card.querySelector(".meta .gold").textContent = "⭐ " + score;
      card.appendChild($(`<div class="why">💡 ${esc(it.why[L])}</div>`));
      const next = $(`<div class="row"><button class="btn">${i + 1 < round.length ? T("Next ➜", "తరువాత ➜") : T("See my score", "నా స్కోర్ చూడు")}</button></div>`);
      next.querySelector("button").onclick = () => { i++; show(); };
      card.appendChild(next);
      next.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    function reveal() {   // "I don't know": the answer, without a point
      if (answered) return;
      answered = true;
      [...opts.children][order.indexOf(it.a)].classList.add("right");
      petSays(T("The answer is: ", "సరైన జవాబు: ") + it.o[it.a][L], "", true);
      after();
    }
    for (const k of order) {
      const b = $(`<button class="opt">${esc(it.o[k][L])}</button>`);
      b.onclick = () => {
        if (answered) return;
        answered = true;
        const right = k === it.a;
        if (right) { score++; b.classList.add("right"); petSays(PRAISE(), "happy", true); }
        else {
          b.classList.add("wrong");
          [...opts.children][order.indexOf(it.a)].classList.add("right");
          petSays(OOPS() + " " + T("The answer is: ", "సరైన జవాబు: ") + it.o[it.a][L], "oops", true);
        }
        after();
      };
      opts.appendChild(b);
    }
    main.replaceChildren(card);
    window.scrollTo(0, 0);
    petSays(T("Choose the right answer!", "సరైన జవాబు ఎంచుకోండి!"), "", false);
    say(it.q[L]);
    const nextBtn = () => card.querySelector(".row .btn");
    CUR = { game: "quiz", voice: h => {
      if (answered) { if (CMD.next.test(h) || CMD.yes.test(h)) { nextBtn().click(); return true; } return false; }
      if (CMD.dontknow.test(h) || CMD.answer.test(h)) { reveal(); return true; }
      // the choice whose words fit best (two fitting the same: they say which one)
      let fits = order.map(key => norm(it.o[key][L]) === h ? 2 : fit(h, it.o[key][L]));
      let top = Math.max(...fits);
      if (top >= 0.5 && fits.filter(f => f === top).length > 1) {   // a tie: count every word of the tied choices
        fits = fits.map((f, j) => f === top ? 1 + fitAll(h, it.o[order[j]][L]) : 0);
        top = Math.max(...fits);
      }
      let k = top >= 0.5 && fits.filter(f => f === top).length === 1 ? fits.indexOf(top) : -1;
      if (k < 0 && h.split(" ").length <= 3) for (const [re, pos] of ORD) if (re.test(h)) { k = pos; break; }
      if (k < 0 && top >= 0.5) { petSays(T("Which one? Say first, second, third or fourth.", "ఏది? మొదటిది, రెండోది, మూడోది లేదా నాలుగోది అని చెప్పండి."), "", true); return true; }
      if (k < 0) return false;
      opts.children[k].click();
      return true;
    } };
    setState(`Habit's quiz game, question ${i + 1} of ${round.length}: "${it.q[L]}" Choices: ${order.map((k, j) => `${j + 1}) ${it.o[k][L]}`).join("; ")}. The right answer is "${it.o[it.a][L]}". Score so far: ${score}.`);
  }
  function done() {
    const b = best("quiz", score);
    const msg = score >= 9 ? T("Champion! 🏆", "ఛాంపియన్! 🏆") : score >= 6 ? T("Very good! 🌟", "చాలా బాగుంది! 🌟") : score >= 3 ? T("Good try! 👍", "మంచి ప్రయత్నం! 👍") : T("Let's practise more! 💪", "ఇంకా ప్రాక్టీస్ చేద్దాం! 💪");
    main.replaceChildren($(`<div class="card center"><div class="big">${score >= 6 ? "🏆" : "🌱"}</div>
      <div class="result">${score} / ${round.length}</div><div class="sub">${msg}</div><div class="sub">${T("Best score", "అత్యుత్తమ స్కోర్")}: ${b}</div>
      <div class="row"><button class="btn" id="again">${T("Play again", "మళ్ళీ ఆడదాం")}</button><button class="btn soft" id="other">${T("Other games", "ఇతర ఆటలు")}</button></div></div>`));
    document.getElementById("again").onclick = quiz;
    document.getElementById("other").onclick = home;
    petSays(msg + " " + T("Say \"again\" to play once more.", "మళ్ళీ ఆడాలంటే \"మళ్ళీ\" అనండి."), "happy", true);
    CUR = { game: "quiz-end", voice: h => { if (CMD.again.test(h) || CMD.yes.test(h)) { quiz(); return true; } return false; } };
    setState(`Habit's quiz game is over: ${score} out of ${round.length}.`);
  }
  show();
}

function riddles() {
  title.textContent = T("Riddles", "పొడుపు కథలు");
  const list = shuffle(RIDDLES[LANG]);
  let i = 0, got = 0;
  leave = home;
  function show() {
    if (i >= list.length) i = 0;
    const [q, a, hint] = list[i];
    const card = $(`<div class="card"><div class="meta"><span class="chip">${T("Riddle", "పొడుపు కథ")} ${i + 1} / ${list.length}</span><span class="chip gold">✅ ${got}</span></div>
      <div class="riddle">${esc(q)}</div><div class="hint hidden">💡 ${esc(hint)}</div><div class="answer hidden">${esc(a)}</div>
      <div class="row"><button class="btn soft" id="hint">${T("Give a hint", "చిన్న క్లూ")}</button><button class="btn" id="show">${T("Show answer", "జవాబు చూపించు")}</button></div></div>`);
    card.querySelector("#hint").onclick = e => { card.querySelector(".hint").classList.remove("hidden"); e.target.disabled = true; e.target.style.opacity = .5; say(hint); };
    card.querySelector("#show").onclick = () => {
      card.querySelector(".answer").classList.remove("hidden");
      const row = card.querySelector(".row");
      row.replaceChildren($(`<button class="btn soft">${T("I didn't get it", "నాకు తెలియలేదు")}</button>`), $(`<button class="btn">${T("I got it! ✅", "నాకు తెలిసింది! ✅")}</button>`));
      row.children[0].onclick = () => { petSays(T("No problem, next one! 😊", "పర్లేదు, తర్వాతది! 😊"), "", false); i++; show(); };
      row.children[1].onclick = () => { got++; best("riddles", got); petSays(PRAISE(), "happy", true); i++; setTimeout(show, 700); };
      petSays(a, "happy", true);
    };
    main.replaceChildren(card);
    window.scrollTo(0, 0);
    petSays(T("Think, think… 🤔", "ఆలోచించండి… 🤔"), "", false);
    say(q);
    const answers = a.split(/[()]|\bor\b|లేదా/).map(x => x.trim()).filter(x => norm(x).length > 1);
    let shown = false;
    CUR = { game: "riddles", voice: h => {
      if (shown) {
        if (CMD.next.test(h) || CMD.yes.test(h)) { i++; show(); return true; }
        return false;
      }
      if (answers.some(x => says(h, x))) {
        shown = true; got++; best("riddles", got);
        card.querySelector(".answer").classList.remove("hidden");
        card.querySelector(".meta .gold").textContent = "✅ " + got;
        card.querySelector(".row").classList.add("hidden");
        petSays(PRAISE() + " " + a + "!", "happy", true);
        const me = i;
        setTimeout(() => { if (CUR.game === "riddles" && i === me) { i++; show(); } }, 4200);
        return true;
      }
      if (CMD.hint.test(h)) { const b = card.querySelector("#hint"); if (b && !b.disabled) b.click(); else say(hint); return true; }
      if (CMD.answer.test(h) || CMD.dontknow.test(h)) { shown = true; card.querySelector("#show").click(); return true; }
      if (CMD.next.test(h)) { i++; show(); return true; }
      // a short reply is a guess; anything longer goes to the pet's brain (with this riddle, so it knows)
      if (h.split(" ").length <= 4 || /\b(is it|it s|answer is|i think)\b|అనుకుంటా|ఏమో|అదా|ఇదా/.test(h)) {
        petSays(T("Not quite! Try again, or say \"hint\" or \"tell the answer\".", "కాదండి! మళ్ళీ ప్రయత్నించండి, లేదా \"క్లూ\" / \"జవాబు చెప్పు\" అనండి."), "oops", true);
        return true;
      }
      return false;
    } };
    card.querySelector("#show").addEventListener("click", () => { shown = true; });
    setState(`Habit's riddles game, riddle ${i + 1}: "${q}" The answer is "${a}". Hint: ${hint}`);
  }
  show();
}

  const grid = card.querySelector(".mem");
  deck.forEach((f, n) => {
    const c = $(`<button class="mc" aria-label="${T("Card", "కార్డు")} ${n + 1}"><span class="b">?</span><span class="f">${f}</span></button>`);
    c.onclick = () => {
      if (lock || c.classList.contains("open") || c.classList.contains("done")) return;
      c.classList.add("open"); open.push(c);
      if (open.length < 2) return;
      moves++; card.querySelector("#mv").textContent = moves;
      const [a, b] = open;
      if (a.querySelector(".f").textContent === b.querySelector(".f").textContent) {
        a.classList.add("done"); b.classList.add("done"); open = []; pairs++;
        card.querySelector("#pr").textContent = pairs;
        if (pairs === 8) setTimeout(won, 500); else petSays(PRAISE(), "happy", false);
      } else {
        lock = true;
        setTimeout(() => { a.classList.remove("open"); b.classList.remove("open"); open = []; lock = false; }, 800);
      }
    };
    grid.appendChild(c);
  });
  main.replaceChildren(card);
  window.scrollTo(0, 0);
  petSays(T("Find the matching pairs!", "ఒకేలాంటి జతలను కనిపెట్టండి!"), "", true);
  CUR = { game: "memory", voice: h => { if (CMD.again.test(h)) { memory(); return true; } petSays(T("Tap two cards to find a pair! 🃏", "రెండు కార్డులు నొక్కి జత కనిపెట్టండి! 🃏"), "", true); return true; } };
  setState("Habit's memory cards game: the person taps two cards at a time to find matching pairs.");
  function won() {
    const b = best("memory", moves, false);
    main.replaceChildren($(`<div class="card center"><div class="big">🧠</div><div class="result">${T("All pairs found!", "అన్ని జతలూ దొరికాయి!")}</div>
      <div class="sub">${T("Moves", "ప్రయత్నాలు")}: ${moves} · ${T("Best", "అత్యుత్తమం")}: ${b}</div>
      <div class="row"><button class="btn" id="again">${T("Play again", "మళ్ళీ ఆడదాం")}</button><button class="btn soft" id="other">${T("Other games", "ఇతర ఆటలు")}</button></div></div>`));
    document.getElementById("again").onclick = memory;
    document.getElementById("other").onclick = home;
    CUR = { game: "memory-end", voice: h => { if (CMD.again.test(h) || CMD.yes.test(h)) { memory(); return true; } return false; } };
    petSays(T("Super memory! 🎉", "భలే జ్ఞాపకశక్తి! 🎉"), "happy", true);
  }
}

// ---------- 4. tic-tac-toe: you (X) against the pet (O) ----------
const tally = { you: 0, pet: 0, draw: 0 };
function tictactoe() {
  title.textContent = T("Tic-tac-toe", "X - O ఆట");
  const b = Array(9).fill(""), LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  let over = false;
  leave = home;
  const card = $(`<div class="card"><div class="score"><span class="chip">${T("You", "మీరు")} ✖ ${tally.you}</span><span class="chip gold">${PET} ⭕ ${tally.pet}</span><span class="chip">${T("Draw", "డ్రా")} ${tally.draw}</span></div>
    <div class="ttt"></div><div class="result" id="res"></div><div class="row hidden" id="again"><button class="btn">${T("Play again", "మళ్ళీ ఆడదాం")}</button></div></div>`);
  const cells = [];
  for (let n = 0; n < 9; n++) {
    const c = $(`<button class="cell" aria-label="${T("Box", "గడి")} ${n + 1}"></button>`);
    c.onclick = () => { if (over || b[n]) return; put(n, "X"); if (!end()) { lockBoard(true); setTimeout(() => { put(petMove(), "O"); end(); lockBoard(false); }, 450); } };
    cells.push(c); card.querySelector(".ttt").appendChild(c);
  }
  let thinking = false;
  function lockBoard(v) { thinking = v; cells.forEach(c => c.disabled = v); }
  card.querySelector("#again button").onclick = tictactoe;
  function put(n, who) { b[n] = who; cells[n].textContent = who === "X" ? "✖" : "⭕"; cells[n].classList.add(who === "X" ? "x" : "o"); }
  function winner(bd) { for (const l of LINES) if (bd[l[0]] && bd[l[0]] === bd[l[1]] && bd[l[1]] === bd[l[2]]) return l; return null; }
  function free(bd) { return bd.map((v, i) => v ? -1 : i).filter(i => i >= 0); }
  function petMove() {
    const f = free(b);
    if (Math.random() < 0.22) return pick(f);        // sometimes the pet makes a mistake, so children can win too
    for (const who of ["O", "X"]) for (const n of f) { const t = b.slice(); t[n] = who; if (winner(t)) return n; }   // win, or stop you winning
    if (!b[4]) return 4;
    const corners = [0, 2, 6, 8].filter(n => !b[n]);
    return corners.length ? pick(corners) : pick(f);
  }
  function end() {
    const w = winner(b);
    if (w) {
      over = true; w.forEach(n => cells[n].classList.add("win"));
      const you = b[w[0]] === "X";
      if (you) { tally.you++; petSays(T("You won! 🎉 Well played!", "మీరు గెలిచారు! 🎉 బాగా ఆడారు!"), "happy", true); }
      else { tally.pet++; petSays(T("I won! 😜 One more?", "నేను గెలిచాను! 😜 ఇంకోసారి?"), "happy", true); }
    } else if (!free(b).length) { over = true; tally.draw++; petSays(T("It's a draw! 🤝", "డ్రా అయింది! 🤝"), "", true); }
    if (over) { card.querySelector("#again").classList.remove("hidden"); card.querySelector("#res").textContent = ""; }
    return over;
  }
  main.replaceChildren(card);
  window.scrollTo(0, 0);
  petSays(T("You are ✖. Your turn first! Tap a box, or say \"middle\", \"top left\" or a number from 1 to 9.", "మీరు ✖. ముందు మీ వంతు! ఒక గడి నొక్కండి, లేదా \"మధ్య\", \"పైన ఎడమ\" లేదా 1 నుంచి 9 లో ఒక నంబర్ చెప్పండి."), "", true);
  const POS = [[/top left|పైన ఎడమ/, 0], [/top (middle|centre|center)|పైన మధ్య/, 1], [/top right|పైన కుడి/, 2], [/(middle|centre|center) left|మధ్య ఎడమ|మధ్యలో ఎడమ/, 3],
    [/(middle|centre|center) right|మధ్య కుడి|మధ్యలో కుడి/, 5], [/bottom left|కింద ఎడమ/, 6], [/bottom (middle|centre|center)|కింద మధ్య/, 7], [/bottom right|కింద కుడి/, 8],
    [/\b(middle|centre|center)\b|మధ్య/, 4]];
  const TE_NUM = ["ఒకటి", "రెండు", "మూడు", "నాలుగు", "ఐదు", "ఆరు", "ఏడు", "ఎనిమిది", "తొమ్మిది"];
  CUR = { game: "tictactoe", voice: h => {
    if (over) { if (CMD.again.test(h) || CMD.yes.test(h)) { tictactoe(); return true; } return false; }
    let n = -1;
    for (const [re, k] of POS) if (re.test(h)) { n = k; break; }
    if (n < 0) { const m = h.match(/\b([1-9])\b/); if (m) n = Number(m[1]) - 1; }
    if (n < 0) TE_NUM.forEach((w, k) => { if (n < 0 && h.includes(w)) n = k; });
    if (n < 0) return false;
    if (b[n] || thinking) { petSays(T("That box is taken! Pick another.", "ఆ గడి నిండిపోయింది! వేరేది చెప్పండి."), "oops", true); return true; }
    cells[n].click();
    return true;
  } };
  setState("Habit's tic-tac-toe game: the person is ✖ and the pet is ⭕. Boxes are numbered 1 to 9, left to right, top to bottom.");
}

// ---------- 5. quick maths ----------
function maths() {
  title.textContent = T("Quick maths", "లెక్కల ఆట");
  let i = 0, score = 0;
  const total = 10;
  leave = home;
  function sum(level) {
    const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    if (level < 4) { const a = r(1, 20), b = r(1, 20); return [`${a} + ${b}`, a + b]; }
    if (level < 7) { const a = r(10, 50), b = r(1, a); return [`${a} − ${b}`, a - b]; }
    const a = r(2, 10), b = r(2, 10); return [`${a} × ${b}`, a * b];
  }
  function show() {
    if (i >= total) return done();
    const [text, ans] = sum(i);
    const wrongs = new Set();
    while (wrongs.size < 3) { const w = ans + (Math.floor(Math.random() * 9) - 4); if (w !== ans && w >= 0) wrongs.add(w); }
    const opts = shuffle([ans, ...wrongs]);
    const card = $(`<div class="card"><div class="meta"><span class="chip">${i + 1} / ${total}</span><span class="chip gold">⭐ ${score}</span></div>
      <div class="math">${text} = ?</div><div class="opts two"></div></div>`);
    let answered = false;
    for (const o of opts) {
      const btn = $(`<button class="opt">${o}</button>`);
      btn.onclick = () => {
        if (answered) return;
        answered = true;
        if (o === ans) { score++; btn.classList.add("right"); petSays(PRAISE(), "happy", false); }
        else { btn.classList.add("wrong"); [...card.querySelectorAll(".opt")].find(x => Number(x.textContent) === ans).classList.add("right"); petSays(OOPS() + " " + text + " = " + ans, "oops", false); }
        card.querySelector(".gold").textContent = "⭐ " + score;
        setTimeout(() => { i++; show(); }, 900);
      };
      card.querySelector(".opts").appendChild(btn);
    }
    main.replaceChildren(card);
    window.scrollTo(0, 0);
    say(text.replace("−", T(" minus ", " మైనస్ ")).replace("×", T(" times ", " ఇంటు ")).replace("+", T(" plus ", " ప్లస్ ")));
    CUR = { game: "maths", voice: h => {
      if (answered) return false;
      const m = h.match(/\d+/);
      if (!m) return false;
      const btn = [...card.querySelectorAll(".opt")].find(x => x.textContent === m[0]);
      if (!btn) { petSays(T(`${m[0]} isn't one of the answers. Look again!`, `${m[0]} జవాబుల్లో లేదు. మళ్ళీ చూడండి!`), "oops", true); return true; }
      btn.click();
      return true;
    } };
    setState(`Habit's quick maths game, question ${i + 1} of ${total}: ${text} = ? The choices are ${opts.join(", ")}; the right answer is ${ans}.`);
  }
  function done() {
    const b = best("maths", score);
    const msg = score >= 9 ? T("Maths star! ⭐", "లెక్కల స్టార్! ⭐") : score >= 6 ? T("Very good! 🌟", "చాలా బాగుంది! 🌟") : T("Practice makes perfect! 💪", "ప్రాక్టీస్‌తో పర్ఫెక్ట్! 💪");
    main.replaceChildren($(`<div class="card center"><div class="big">🔢</div><div class="result">${score} / ${total}</div><div class="sub">${msg}</div>
      <div class="sub">${T("Best score", "అత్యుత్తమ స్కోర్")}: ${b}</div>
      <div class="row"><button class="btn" id="again">${T("Play again", "మళ్ళీ ఆడదాం")}</button><button class="btn soft" id="other">${T("Other games", "ఇతర ఆటలు")}</button></div></div>`));
    document.getElementById("again").onclick = maths;
    document.getElementById("other").onclick = home;
    CUR = { game: "maths-end", voice: h => { if (CMD.again.test(h) || CMD.yes.test(h)) { maths(); return true; } return false; } };
    petSays(msg, "happy", true);
  }
  petSays(T("Pick the right answer, fast!", "త్వరగా సరైన జవాబు ఎంచుకోండి!"), "", true);
  show();
}

// ---------- the games list ----------
const GAMES = {
  quiz: { run: quiz, em: "🧠", en: ["Quiz", "10 questions: India, science, safety"], te: ["క్విజ్", "10 ప్రశ్నలు: దేశం, సైన్స్, జాగ్రత్తలు"] },
  riddles: { run: riddles, em: "🤔", en: ["Riddles", "Think and guess"], te: ["పొడుపు కథలు", "ఆలోచించి చెప్పండి"] },
  memory: { run: memory, em: "🃏", en: ["Memory cards", "Find the pairs"], te: ["జ్ఞాపకశక్తి ఆట", "జతలను కనిపెట్టండి"] },
  tictactoe: { run: tictactoe, em: "⭕", en: ["Tic-tac-toe", "Play against me"], te: ["X - O ఆట", "నాతో ఆడండి"] },
  maths: { run: maths, em: "🔢", en: ["Quick maths", "Add, take away, multiply"], te: ["లెక్కల ఆట", "కూడిక, తీసివేత, గుణకారం"] }
};
function home() {
  hush();
  title.textContent = T("Games", "ఆటలు");
  leave = null;
  const grid = $(`<div class="grid"></div>`);
  for (const [key, g] of Object.entries(GAMES)) {
    const [name, line] = g[LANG];
    const tile = $(`<button class="tile${key === "maths" ? " wide" : ""}" data-game="${key}"><span class="em">${g.em}</span><span><b>${esc(name)}</b><br><small>${esc(line)}</small></span></button>`);
    tile.onclick = () => g.run();
    grid.appendChild(tile);
  }
  main.replaceChildren(grid, $(`<div class="foot">${T("Everything stays on this phone. No internet needed.", "అంతా ఈ ఫోన్‌లోనే. ఇంటర్నెట్ అవసరం లేదు.")}</div>`));
  window.scrollTo(0, 0);
  petSays(T("Let's play! Pick a game 🎮", "ఆట ఆడదాం! ఒక ఆట ఎంచుకోండి 🎮"), "happy", false);
  CUR = { game: "home", voice: h => {
    say(T("Which game? Quiz, riddles, memory cards, tic-tac-toe or maths.", "ఏ ఆట? క్విజ్, పొడుపు కథలు, జ్ఞాపకశక్తి ఆట, X-O ఆట, లేదా లెక్కల ఆట?"));
    return true;
  } };
  setState("Habit's games page: the list of games (quiz, riddles, memory cards, tic-tac-toe, quick maths).");
}
document.getElementById("back").onclick = () => {
  if (leave) { const f = leave; f(); return; }
  if (app && app.close) app.close(); else history.back();
};
window.goBack = () => document.getElementById("back").click();   // the phone's back button
const start = Q.get("game");
if (start === "any") { const keys = Object.keys(GAMES); GAMES[pick(keys)].run(); }
else if (GAMES[start]) GAMES[start].run();
else home();
</script>
