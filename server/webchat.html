<title>Habit Chat Web</title>
<link rel="icon" href="/favicon-32.png">
<!--
  Habit Chat on a computer (like WhatsApp Web), at bigdai.tech/web.
  - Linking: this page makes a one-time key and shows it in a QR code; the phone scans it and sends its chat key (and a
    copy of recent chats) locked for that one-time key. The server only passes the locked box on and can't open it.
  - The chat key is kept in this browser as a key that can't be read out (WebCrypto, non-extractable); messages are
    opened and locked here, exactly like on the phone (ECDH P-256 + HKDF-SHA256 + AES-256-GCM).
  - Strict content rules (set by the server): this page may only talk to bigdai.tech, loads nothing from elsewhere,
    and can't be shown inside another site.
-->
<style nonce="__NONCE__">

}

.b { font-weight: 700; } .center { text-align: center; } .grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; } .col { display: flex; flex-direction: column; }

::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #39417a; border-radius: 8px; } ::-webkit-scrollbar-track { background: transparent; }

/* ---------- the app ---------- */
#app { display: flex; height: 100vh; max-width: 1680px; margin: 0 auto; background: var(--navy); box-shadow: 0 0 40px #0008; }

.av.s40 { width: 40px; height: 40px; font-size: 19px; } .av.s34 { width: 34px; height: 34px; font-size: 16px; } .av.s90 { width: 92px; height: 92px; font-size: 44px; }
.av.ring { box-shadow: 0 0 0 3px var(--gold); } .av.ring.seen { box-shadow: 0 0 0 3px #5b6290; }
.tabs { display: flex; gap: 4px; margin: 10px 12px 0; padding: 4px; background: var(--bar); border-radius: 22px; }
.tabs button { flex: 1; padding: 7px 4px; border-radius: 18px; color: var(--sub); font-size: 13px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.tabs button b { font-size: 15px; color: var(--txt); } .tabs button.on { background: var(--gold); color: var(--navy); font-weight: 700; } .tabs button.on b { color: var(--navy); }
.search { margin: 10px 12px 0; display: flex; align-items: center; gap: 8px; background: var(--bar); border-radius: 22px; padding: 0 14px; }
.search input { flex: 1; background: none; border: 0; outline: 0; padding: 10px 0; }

.chip.on { background: var(--gold); color: var(--navy); font-weight: 700; }
.list { flex: 1; overflow-y: auto; padding: 2px 0 20px; }
.crow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; position: relative; }
.crow:hover { background: var(--hover); } .crow.on { background: var(--sel); }
.crow .mid { flex: 1; min-width: 0; } .crow .nm { font-weight: 700; font-size: 15.5px; } .crow .pv { color: var(--sub); font-size: 13.5px; }

.badge.muted { background: var(--sub); } .udot { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); display: inline-block; }

/* ---------- a chat ---------- */

.day { margin: 12px auto 6px; width: max-content; max-width: 90%; padding: 4px 12px; border-radius: 10px; background: var(--card); color: var(--sub); font-size: 12px; font-weight: 700; position: sticky; top: 4px; z-index: 2; }
.sysl { margin: 7px auto; width: max-content; max-width: 86%; padding: 6px 12px; border-radius: 10px; background: var(--card); color: var(--sub); font-size: 12.5px; text-align: center; }
.mrow { display: flex; margin: 3px 0; align-items: center; gap: 6px; position: relative; }
.mrow.mine { justify-content: flex-end; }
.mcol { display: flex; flex-direction: column; max-width: min(68%, 560px); min-width: 0; }
.mrow.mine .mcol { align-items: flex-end; }
.bub { position: relative; padding: 6px 9px 5px 10px; border-radius: 12px; background: var(--card); min-width: 70px; max-width: 100%; overflow-wrap: anywhere; box-shadow: 0 1px 1px #0003; }
.mrow.mine .bub { background: var(--mine); }
.mrow.first:not(.mine) .bub { border-top-left-radius: 3px; } .mrow.first.mine .bub { border-top-right-radius: 3px; }
.bub::after { content: ""; display: block; clear: both; }
.bub.bare { background: none !important; box-shadow: none; padding: 0; }
.bub .from { font-weight: 700; font-size: 13px; margin-bottom: 1px; }

.bub .txt mark { background: #F6C45388; color: inherit; border-radius: 3px; }

.mrow:hover .quick { display: inline-flex; }
.rx { margin-top: -6px; padding: 1px 8px 2px; border-radius: 12px; background: var(--bar); border: 1px solid var(--line); font-size: 13px; cursor: pointer; z-index: 1; width: max-content; }
.mrow.mine .rx { margin-right: 8px; } .mrow:not(.mine) .rx { margin-left: 8px; }
.quote { display: flex; border-radius: 8px; background: #0003; overflow: hidden; margin-bottom: 4px; cursor: pointer; }
.quote .bar { width: 4px; flex: none; } .quote .in { padding: 4px 9px 5px; min-width: 0; } .quote .w { font-weight: 700; font-size: 12.5px; } .quote .p { color: var(--sub); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.media { display: block; border-radius: 10px; overflow: hidden; background: var(--line); position: relative; cursor: pointer; max-width: 100%; }

.media .play { width: 54px; height: 54px; border-radius: 50%; background: #0009; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; }

.blur { filter: blur(8px); transform: scale(1.1); }
.doc { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: #0003; min-width: 230px; cursor: pointer; }
.doc .ic { font-size: 28px; } .doc .dl { color: var(--gold); font-size: 20px; font-weight: 700; }
.voice { display: flex; align-items: center; gap: 10px; min-width: 240px; padding: 2px 0; }
.voice .pb { width: 40px; height: 40px; border-radius: 50%; background: var(--gold); color: var(--navy); font-size: 18px; display: flex; align-items: center; justify-content: center; flex: none; }

.lp { display: block; border-radius: 10px; background: #0003; overflow: hidden; margin-bottom: 5px; text-decoration: none; color: inherit; max-width: 330px; }
.lp img { width: 100%; max-height: 180px; object-fit: cover; display: block; } .lp .w { padding: 7px 10px 8px; } .lp .t { font-weight: 700; } .lp .d { color: var(--sub); font-size: 13px; } .lp .s { color: var(--gold); font-size: 12px; }
.locmap { height: 110px; border-radius: 10px; background: #0C2A2E; display: flex; align-items: center; justify-content: center; font-size: 40px; }
.notice { padding: 14px; text-align: center; color: var(--sub); background: var(--bar); border-top: 1px solid var(--line); }
.banner { margin: 10px auto; max-width: 560px; padding: 14px 16px; border-radius: 14px; background: var(--card); text-align: center; }
.jump { position: absolute; right: 22px; bottom: 86px; width: 42px; height: 42px; border-radius: 50%; background: var(--bar); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 5; box-shadow: 0 2px 8px #0008; }

/* ---------- typing ---------- */
.composer { flex: none; background: var(--bar); border-top: 1px solid var(--line); }
.replybar { display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; }

.inrow { display: flex; align-items: flex-end; gap: 6px; padding: 8px 10px; }
.inbox { flex: 1; background: var(--card); border-radius: 22px; display: flex; align-items: flex-end; padding: 0 6px 0 14px; min-width: 0; }
.inbox textarea { flex: 1; background: none; border: 0; outline: 0; resize: none; padding: 11px 0; max-height: 180px; min-height: 44px; line-height: 1.4; font-size: calc(15px * var(--fs)); }
.send { width: 46px; height: 46px; border-radius: 50%; background: var(--gold); color: var(--navy); font-size: 19px; display: inline-flex; align-items: center; justify-content: center; flex: none; font-weight: 700; }
.send.rec { background: var(--danger); color: #fff; }
.recbar { display: flex; align-items: center; gap: 12px; padding: 0 12px; flex: 1; height: 46px; background: var(--card); border-radius: 22px; }
.recdot { width: 12px; height: 12px; border-radius: 50%; background: var(--danger); animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .2; } }
.panel { height: 330px; display: flex; flex-direction: column; border-top: 1px solid var(--line); background: var(--bar); }
.ptabs { display: flex; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.ptabs button { padding: 5px 9px; border-radius: 10px; font-size: 18px; } .ptabs button.on { background: var(--card); }
.ptabs .word { font-size: 13.5px; font-weight: 700; }
.pbody { flex: 1; overflow-y: auto; padding: 8px 10px; }
.egrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); }
.egrid button { font-size: 25px; height: 42px; border-radius: 8px; } .egrid button:hover { background: var(--card); }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.sgrid button { border-radius: 10px; padding: 4px; } .sgrid button:hover { background: var(--card); } .sgrid canvas { width: 88px; height: 88px; display: block; margin: auto; }
.mention { position: absolute; left: 70px; bottom: 64px; width: 280px; max-height: 240px; overflow-y: auto; background: var(--bar); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 24px #000a; z-index: 20; }
.mention button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 12px; text-align: left; } .mention button:hover, .mention button.on { background: var(--hover); }

/* ---------- menus, dialogs, toasts ---------- */
.pop { position: fixed; z-index: 60; min-width: 210px; max-width: 320px; background: #fff; color: #1b1f3b; border-radius: 12px; box-shadow: 0 10px 34px #000b; padding: 6px 0; max-height: 80vh; overflow-y: auto; }
.pop button { display: block; width: 100%; text-align: left; padding: 10px 18px; font-size: 14.5px; color: #1b1f3b; }
.pop button:hover { background: #eef0f8; } .pop .sep { height: 1px; background: #e2e5f0; margin: 4px 0; }
.pop .rxrow { display: flex; justify-content: space-around; padding: 4px 8px 8px; } .pop .rxrow button { width: 40px; height: 40px; padding: 0; text-align: center; font-size: 23px; border-radius: 50%; } .pop .rxrow button.on { background: #F6C45355; }
.shade { position: fixed; inset: 0; background: #000a; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg { width: 440px; max-width: 100%; max-height: 92vh; display: flex; flex-direction: column; background: var(--bar); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 60px #000c; overflow: hidden; }
.dlg.wide { width: 560px; }
.dlg .dh { padding: 16px 20px 6px; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.dlg .db { padding: 8px 20px 12px; overflow-y: auto; }
.dlg .df { padding: 10px 16px 14px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.btn { padding: 9px 18px; border-radius: 20px; background: var(--card); font-weight: 700; }
.btn.pri { background: var(--gold); color: var(--navy); } .btn.danger { background: var(--danger); color: #fff; }
.btn:hover { filter: brightness(1.1); } .btn:disabled { opacity: .5; cursor: default; }
.fld { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; outline: 0; margin: 6px 0; }
.fld:focus { border-color: var(--gold); }
textarea.fld { resize: vertical; min-height: 70px; }
.lbl { font-size: 12.5px; color: var(--sub); margin-top: 8px; display: block; }
.pick { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 10px; cursor: pointer; }
.pick:hover { background: var(--hover); } .pick input { width: 18px; height: 18px; accent-color: var(--gold); }
.set { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.set:last-child { border-bottom: 0; } .set .t { font-weight: 700; } .set .s { font-size: 12.5px; color: var(--sub); }
.switch { width: 42px; height: 24px; border-radius: 12px; background: #4a5180; position: relative; flex: none; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on { background: var(--gold); } .switch.on::after { left: 21px; }
.toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: #fff; color: #1b1f3b; padding: 10px 18px; border-radius: 12px; box-shadow: 0 6px 24px #000a; z-index: 90; font-weight: 600; max-width: 90vw; text-align: center; }
.light { position: fixed; inset: 0; z-index: 80; background: #000e; display: flex; flex-direction: column; }
.light .lt { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: #fff; }

.light img, .light video { max-width: 100%; max-height: 100%; object-fit: contain; }

/* ---------- status ---------- */
.stv { position: fixed; inset: 0; z-index: 85; background: #05060d; display: flex; flex-direction: column; color: #fff; }
.stv .prog { display: flex; gap: 4px; padding: 12px 16px 0; } .stv .prog div { flex: 1; height: 3px; border-radius: 2px; background: #ffffff44; overflow: hidden; } .stv .prog i { display: block; height: 100%; width: 0; background: #fff; }

  t.remarks = t.remarks || [];

    case "new": Object.assign(t, { title: b.title || "", note: b.note || "", by: m.sender, to: b.to || "", due: Number(b.due) || 0, state: "open", at: m.at }); break;

    case "done": t.state = "done"; t.remarks.push({ by: m.sender, text: T("✔ Marked done", "✔ పని పూర్తయింది") + (b.text ? ": " + b.text : ""), at: m.at }); break;

async function processSync(j) {

  for (const cid of j.gone || []) patchConv(cid, c => { c.member = false; });
  for (const t of j.ticks || []) patchConv(t.cid, c => { c.st = t.st; dirty(t.cid); });
  for (const t of j.typing || []) onTyping(t, j.now || now());

  if (j.status) loadStatus(true);
  if (j.comms) S.comms = null;
  const fresh = [];
  for (const m of j.msgs || []) {
    if (S.locked.has(m.cid)) continue;                       // 🔒 locked chats stay on the phone
    const old = findMsg(m.cid, m.id);
    if (old) { if (m.from === S.uid && (old.state !== 1 || !old.seq)) setSent(m.cid, m.id, m.seq, m.at, 1); continue; }
    const cm = await decode(m);
    stopTyping(cm.cid, cm.sender);
    if (cm.kind === "del") { applyDelete(cm); continue; }
    if (cm.kind === "call") { onCall(cm); continue; }
    if (cm.kind === "react") { const n = applyReact(cm); if (n) fresh.push(n); continue; }
    if (HIDDEN.has(cm.kind)) { applyCtl(cm); continue; }
    let c = conv(cm.cid);
    if (!c) { await refreshConvs(); c = conv(cm.cid); if (!c) continue; }
    if (isGroup(c) && c.onlyAdmins && !isAdmin(c, cm.sender) && !["task", "sys", "locked"].includes(cm.kind)) continue;
    if (cm.kind === "timer" && !applyTimer(cm)) continue;
    expiry(cm);
    putMsg(cm);
    if (cm.kind === "task") applyTask(cm);
    const mine = cm.sender === S.uid;
    const reading = cm.cid === S.open && looking();
    touch(cm.cid, cm.at, preview(cm), !mine && !reading && cm.kind !== "sys");
    if (!mine && cm.kind !== "sys") fresh.push(cm);

}

async function syncLoop() {
  if (S.running) return;
  S.running = true;
  let pause = 1000;
  while (S.running) {
    const fg = document.visibilityState === "visible";
    const r = await api("GET", "/api/chat/sync?c=" + S.cursor + "&wait=1" + (fg ? "&fg=1" : ""), undefined, { timeout: 45000 });
    if (!S.running) break;
    if (r.status === 403 || (r.status === 409 && r.json.needKey)) { loggedOut(); break; }
    if (!r.ok) { setOnline(false); await sleep(pause); pause = Math.min(pause * 2, 30000); continue; }
    setOnline(true); pause = 1000;
    try { await processSync(r.json); } catch (e) { console.warn("sync", e); }
    if (typeof r.json.cursor === "number") { S.cursor = r.json.cursor; DB.put("kv", S.cursor, "cursor"); }
    flushPending();

}
function setOnline(on) { if (S.online === on) return; S.online = on; const b = document.getElementById("offline"); if (b) b.classList.toggle("hidden", on); }

// sending (like the phone's ChatSync.send / deliver): locked here for everyone in the chat

function cleanBody(b) {

// ---------- files that came in ----------
function autoFetch(m) {
  if (!hasFile(m) || (m.kind === "photo" && m.body.once)) return false;
  if (["photo", "voice", "sticker", "gif"].includes(m.kind)) return true;
  return (m.body.size || 0) > 0 && m.body.size <= 3e6 && m.kind === "doc" && /^(image|audio)\//.test(m.body.mime || "");
}
const mimeOf = m => m.kind === "photo" ? "image/jpeg" : m.kind === "sticker" ? "image/png" : m.kind === "gif" ? "image/gif" : m.kind === "video" ? "video/mp4"
  : m.kind === "voice" ? (m.body.mime || "audio/mp4") : (m.body.mime && /^[\w.+-]+\/[\w.+-]+$/.test(m.body.mime) ? m.body.mime : "application/octet-stream");

async function fetchFile(m, force) {
  const id = m.body.file; if (!id) return null;
  if (S.files.has(id)) return S.files.get(id);
  if (S.fetching.has(id)) return null;
  S.fetching.add(id); dirty(m.cid);
  try {
    let bytes = null;
    const kept = await DB.get("files", id);
    if (kept instanceof Blob) { const u = URL.createObjectURL(kept); S.files.set(id, u); return u; }
    const locked = await download(id);
    if (!locked) { m.body._nofile = true; return null; }
    bytes = await openFile(locked, m.body.key, m.body.iv);
    const blob = new Blob([bytes], { type: mimeOf(m) });
    const u = URL.createObjectURL(blob); S.files.set(id, u);
    if (bytes.length < 4e6 && ["photo", "sticker", "gif", "voice"].includes(m.kind)) DB.put("files", blob, id);
    return u;
  } catch (e) { m.body._nofile = true; return null; }

      putMsg({ cid, id: String(m.id), seq: Number(m.seq) || 0, sender: String(m.sender || ""), at: Number(m.at) || 0, kind, body: m.body && typeof m.body === "object" && !Array.isArray(m.body) ? m.body : {}, state: m.state === -1 ? -1 : 1 });
    }
  }
  const ts = H.tasks && typeof H.tasks === "object" ? H.tasks : {};
  for (const cid of Object.keys(ts)) if (!S.locked.has(cid) && Array.isArray(ts[cid])) for (const t of ts[cid]) if (t && t.tid) putTask(cid, Object.assign({}, t));
}
async function start(fresh) {
  buildApp();
  if (S.histNote) { toast(S.histNote, 6000); S.histNote = ""; }
  const ok = await refreshConvs();
  if (S.loggingOut) return;
  if (fresh && ok === false && !S.online) toast(noConn());
  expire();
  syncLoop();
  loadStatus(true);
  if (fresh && typeof Notification !== "undefined" && Notification.permission === "default") setTimeout(() => toast(T("Tip: ⋮ › Settings › Notifications, to get pop-ups for new messages.", "చిట్కా: ⋮ › సెట్టింగ్స్ › నోటిఫికేషన్లు ఆన్ చేయండి."), 6000), 2500);
}
async function loggedOut(why) {
  if (S.loggingOut) return; S.loggingOut = true;
  S.running = false;
  await DB.wipe();
  try { sessionStorage.setItem("habit-web-why", why || T("This computer was logged out from your phone (or your phone's chat lock changed). Link it again to use Habit Chat here.", "ఈ కంప్యూటర్ మీ ఫోన్ నుంచి లాగ్ అవుట్ అయింది. ఇక్కడ వాడటానికి మళ్ళీ లింక్ చేయండి.")); } catch (e) { }
  location.reload();
}
async function logout() {
  await api("POST", "/api/web/logout", {});
  loggedOut(T("You logged out of Habit Chat on this computer.", "ఈ కంప్యూటర్‌లో Habit చాట్ నుంచి లాగ్ అవుట్ అయ్యారు."));
}

// =====================================================================================================
// starting
// =====================================================================================================
async function boot() {
  LANG = /^te\b/i.test(navigator.language || "") ? "te" : "en";
  let why = ""; try { why = sessionStorage.getItem("habit-web-why") || ""; sessionStorage.removeItem("habit-web-why"); } catch (e) { }
  if (!window.crypto || !crypto.subtle || !window.fetch) { document.getElementById("root").textContent = "Please open this page in a recent Chrome, Edge or Firefox."; return; }
  await DB.open();
  const lang = await DB.get("kv", "lang"); if (lang === "te" || lang === "en") LANG = lang;
  const key = await DB.get("kv", "key");
  if (!key || !key.priv || !key.uid) {
    const old = await DB.get("kv", "dev");
    if (old) api("POST", "/api/web/logout", {}, { dev: old });          // a link that didn't finish: tidy it on the server
    if (old) { await DB.wipe(); await DB.open(); if (lang) DB.put("kv", lang, "lang"); }
    linkScreen(why);
    return;
  }
  loading(T("Opening your chats…", "మీ చాట్‌లు తెరుస్తున్నాం…"));
  S.dev = await DB.get("kv", "dev") || "";
  Object.assign(S, { priv: key.priv, pub: key.pub, uid: key.uid, kid: key.kid, keep: true });
  S.me = await DB.get("kv", "me") || {};
  S.set = Object.assign(S.set, await DB.get("kv", "set") || {});
  S.lists = await DB.get("kv", "lists") || [];
  S.locked = new Set(await DB.get("kv", "locked") || []);
  S.pet = await DB.get("kv", "pet") || "puppy";
  S.privacy = await DB.get("kv", "privacy") || S.privacy;
  S.cursor = Number(await DB.get("kv", "cursor")) || 0;
  S.recentEmoji = await DB.get("kv", "recentEmoji") || [];
  S.recentStickers = await DB.get("kv", "recentStickers") || [];
  for (const c of await DB.all("convs")) if (c && c.cid) S.convs.set(c.cid, c);
  for (const m of await DB.all("msgs")) { if (!m || !m.cid) continue; let l = S.msgs.get(m.cid); if (!l) S.msgs.set(m.cid, l = []); l.push(m); }
  for (const l of S.msgs.values()) l.sort((a, b) => a.at - b.at);
  for (const t of await DB.all("tasks")) { if (!t || !t.cid) continue; let mm = S.tasks.get(t.cid); if (!mm) S.tasks.set(t.cid, mm = new Map()); mm.set(t.tid, t); }
  loading("");
  start(false);
}
window.addEventListener("focus", () => { if (S.open && UI.msgs) markRead(S.open); });
document.addEventListener("visibilitychange", () => { if (looking() && S.open && UI.msgs) markRead(S.open); if (document.visibilityState === "hidden") { saveDraft(); DB.flush(); } });
window.addEventListener("pagehide", () => {
  DB.flush();
  if (!S.keep && S.uid && !S.loggingOut) api("POST", "/api/web/logout", {}, { keepalive: true });   // a shared computer: log out when the tab goes
});
setInterval(() => { if (!UI.app) return; if (expire()) paint(); if (S.open) paintHeader(conv(S.open)); }, 30000);
boot();
})();
</script>
