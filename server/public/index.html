<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Soul Friend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@500;700&family=Hind+Guntur:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app. Robot stage on top, expression chips, chat log fills the rest, composer pinned at bottom. */
:root{
  --bg:#EEF1FA; --surface:#FFFFFF; --fg:#1C2140; --muted:#5F6688; --line:#D8DDF0;
  --robot:#6E7CF4; --robot-dark:#4C59CF; --screen:#141833; --marigold:#F5A524; --blush:#FF8FA8;
  --me:#1C2140; --me-fg:#FFFFFF; --bot:#FFFFFF; --chip:#E3E7F8;
  --display:"Baloo Tammudu 2","Hind Guntur",system-ui,sans-serif;
  --body:"Hind Guntur","Noto Sans Telugu",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1226; --surface:#1A1F3D; --fg:#ECEEFB; --muted:#A3A9CC; --line:#2C3360;
  --robot:#7D8AFF; --robot-dark:#5966E0; --screen:#070918; --me:#F5A524; --me-fg:#1C1406; --bot:#1A1F3D; --chip:#252B52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1226; --surface:#1A1F3D; --fg:#ECEEFB; --muted:#A3A9CC; --line:#2C3360;
  --robot:#7D8AFF; --robot-dark:#5966E0; --screen:#070918; --me:#F5A524; --me-fg:#1C1406; --bot:#1A1F3D; --chip:#252B52; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;display:flex;justify-content:center}
.app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));gap:8px;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.name{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
.name small{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-top:4px}
.ctrls{display:flex;gap:6px;align-items:center}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button,.icon{border:0;background:transparent;color:var(--fg);font:500 13px var(--body);padding:5px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.icon{background:var(--chip);padding:6px 10px}
.icon[aria-pressed="false"]{opacity:.55}
button:focus-visible,input:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.stage{display:flex;align-items:center;gap:12px}
#bot{width:150px;height:auto;flex:none}
.mood{min-width:0}
.mood .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mood .val{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.mood .te{color:var(--muted);font-size:15px}
.faces{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.faces button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--body);padding:5px 11px;border-radius:999px;cursor:pointer}
.faces button.on{background:var(--robot);border-color:var(--robot);color:#fff}
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.b{max-width:85%;padding:9px 13px;border-radius:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.b.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:6px}
.b.me{align-self:flex-end;background:var(--me);color:var(--me-fg);border-bottom-right-radius:6px}
.b.note{align-self:center;background:transparent;color:var(--muted);font-size:13px;text-align:center}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px dashed var(--robot);background:transparent;color:var(--fg);font:400 14px var(--body);padding:6px 11px;border-radius:14px;cursor:pointer;text-align:left}
form{display:flex;gap:8px}
#msg{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:400 16px var(--body);padding:11px 14px;border-radius:999px}
#send{border:0;background:var(--marigold);color:#1C1406;font:700 16px var(--display);padding:0 18px;border-radius:999px;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}

.b.bot .tools{display:block;margin-top:4px}
.rep{border:0;background:transparent;color:var(--muted);font:400 12px var(--body);padding:2px 0;cursor:pointer;text-decoration:underline}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.reasons button{border:1px solid var(--line);background:var(--chip);color:var(--fg);font:400 13px var(--body);padding:4px 10px;border-radius:999px;cursor:pointer}
.foot{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.foot button,.foot a{border:0;background:transparent;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
/* robot */
#head{transform-box:view-box;transform-origin:120px 140px;transition:transform .35s}
#eyes{transform-box:view-box;transform-origin:120px 112px}
#bot path,#bot ellipse{transition:d .2s}
#bulb{transition:fill .3s}
@media (prefers-reduced-motion:no-preference){
  #head{animation:bob 3.2s ease-in-out infinite}
  #head.shake{animation:shake .35s ease-in-out 4}
  #eyes{animation:blink 4.5s infinite}
}
#head.tilt{transform:rotate(-7deg)}
#head.droop{transform:translateY(5px)}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes shake{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (max-width:380px){#bot{width:120px}.name{font-size:21px}}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="name">Soul Friend<small>ఆత్మ మిత్రుడు</small></div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Reply language">
        <button type="button" data-lang="auto" aria-pressed="true">Auto</button>
        <button type="button" data-lang="te" aria-pressed="false">తెలుగు</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="icon" id="voice" aria-pressed="true" aria-label="Voice on">🔊</button>
    </div>
  </header>

  <div class="stage">
    <svg id="bot" viewBox="0 0 240 236" role="img" aria-label="Soul Friend robot face">
      <g id="head">
        <line x1="120" y1="50" x2="120" y2="28" stroke="var(--robot-dark)" stroke-width="5" stroke-linecap="round"/>
        <circle id="bulb" cx="120" cy="22" r="9" fill="var(--marigold)"/>
        <rect x="22" y="100" width="18" height="44" rx="9" fill="var(--robot-dark)"/>
        <rect x="200" y="100" width="18" height="44" rx="9" fill="var(--robot-dark)"/>
        <rect x="36" y="48" width="168" height="150" rx="58" fill="var(--robot)"/>
        <rect x="56" y="70" width="128" height="106" rx="42" fill="var(--screen)"/>
        <circle id="ck1" cx="78" cy="140" r="8" fill="var(--blush)" opacity="0"/>
        <circle id="ck2" cx="162" cy="140" r="8" fill="var(--blush)" opacity="0"/>
        <path id="br1" d="" fill="none" stroke="var(--marigold)" stroke-width="4" stroke-linecap="round"/>
        <path id="br2" d="" fill="none" stroke="var(--marigold)" stroke-width="4" stroke-linecap="round"/>
        <g id="eyes">
          <path id="e1" d="" stroke="var(--marigold)" stroke-width="5" stroke-linecap="round"/>
          <path id="e2" d="" stroke="var(--marigold)" stroke-width="5" stroke-linecap="round"/>
        </g>
        <path id="mouth" d="" stroke="var(--marigold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text id="acc" x="194" y="44" font-size="30" font-weight="700" fill="var(--marigold)" font-family="system-ui,sans-serif"></text>
      </g>
      <rect x="86" y="200" width="68" height="30" rx="14" fill="var(--robot-dark)"/>
      <circle cx="120" cy="215" r="6" fill="var(--blush)"/>
    </svg>
    <div class="mood" aria-live="polite">
      <div class="lbl">Feeling</div>
      <div class="val" id="moodEn">Happy</div>
      <div class="te" id="moodTe">సంతోషం</div>
    </div>
  </div>

  <div class="faces" id="faces" aria-label="Try a face"></div>

  <div class="log" id="log" aria-live="polite"></div>

  <form id="f">
    <input id="msg" autocomplete="off" placeholder="Type in Telugu or English…" aria-label="Message">
    <button id="send" type="submit">Send</button>
  </form>
  <div class="foot"><span>AI can make mistakes.</span><button type="button" id="clear">Clear chat</button><a id="privacy" href="#" target="_blank" rel="noopener">Privacy</a></div>
</div>

<script>
const $=id=>document.getElementById(id);
const LX=96,RX=144,EY=112;
const O=(cx,cy,rx,ry)=>({d:`M${cx-rx} ${cy}a${rx} ${ry} 0 1 0 ${2*rx} 0a${rx} ${ry} 0 1 0 ${-2*rx} 0z`,fill:1});
const ARC=cx=>({d:`M${cx-11} ${EY+4}Q${cx} ${EY-12} ${cx+11} ${EY+4}`,fill:0});
const HEART=cx=>({d:`M${cx} ${EY+10}C${cx-15} ${EY} ${cx-13} ${EY-13} ${cx} ${EY-5}C${cx+13} ${EY-13} ${cx+15} ${EY} ${cx} ${EY+10}z`,fill:1});
const S=d=>({d,fill:0}), F=d=>({d,fill:1});
const FACES={
  happy:{en:"Happy",te:"సంతోషం",eyes:[ARC(LX),ARC(RX)],mouth:S("M100 140Q120 162 140 140"),ck:1,bulb:"#F5A524"},
  laughing:{en:"Laughing",te:"నవ్వు",eyes:[ARC(LX),ARC(RX)],mouth:F("M98 138Q120 176 142 138Z"),ck:1,anim:"shake",bulb:"#FFD166"},
  thinking:{en:"Thinking",te:"ఆలోచన",eyes:[O(LX+5,EY-3,8,10),O(RX+5,EY-3,8,10)],brows:["M86 96L106 96","M134 90Q145 83 156 90"],mouth:S("M110 150Q122 146 134 149"),acc:"…",anim:"tilt",bulb:"#8EC5FF"},
  surprised:{en:"Surprised",te:"ఆశ్చర్యం",eyes:[O(LX,EY,11,14),O(RX,EY,11,14)],brows:["M84 90Q96 81 108 90","M132 90Q144 81 156 90"],mouth:F("M113 151a7 9 0 1 0 14 0a7 9 0 1 0 -14 0z"),acc:"!",bulb:"#FF8FA8"},
  sad:{en:"Sad",te:"బాధ",eyes:[O(LX,EY+3,7,9),O(RX,EY+3,7,9)],brows:["M84 98L106 92","M134 92L156 98"],mouth:S("M104 157Q120 143 136 157"),anim:"droop",bulb:"#7D8AA8"},
  confused:{en:"Confused",te:"గందరగోళం",eyes:[O(LX,EY,9,12),O(RX,EY,6,8)],brows:["M84 94L106 99","M134 90Q145 84 156 90"],mouth:S("M104 150Q110 144 116 150Q122 156 128 150Q134 144 138 150"),acc:"?",anim:"tilt",bulb:"#C3A6FF"},
  love:{en:"Love",te:"ప్రేమ",eyes:[HEART(LX),HEART(RX)],mouth:S("M100 140Q120 162 140 140"),ck:1,acc:"♥",bulb:"#FF6B8B"},
  wink:{en:"Wink",te:"కన్ను గీటు",eyes:[O(LX,EY,9,12),ARC(RX)],mouth:S("M102 142Q122 160 140 138"),ck:1,bulb:"#F5A524"},
  calm:{en:"Calm",te:"ప్రశాంతం",eyes:[O(LX,EY,9,12),O(RX,EY,9,12)],mouth:S("M106 146Q120 154 134 146"),bulb:"#5DD3B0"}
};
let current="happy", talkTimer=null, talkStop=null;

function paint(el,shape){el.setAttribute("d",shape.d);el.setAttribute("fill",shape.fill?"var(--marigold)":"none");}
function setFace(name){
  const f=FACES[name]||FACES.calm; current=FACES[name]?name:"calm";
  paint($("e1"),f.eyes[0]); paint($("e2"),f.eyes[1]);
  if(!talkTimer) paint($("mouth"),f.mouth);
  $("br1").setAttribute("d",f.brows?f.brows[0]:""); $("br2").setAttribute("d",f.brows?f.brows[1]:"");
  $("ck1").setAttribute("opacity",f.ck?.75:0); $("ck2").setAttribute("opacity",f.ck?.75:0);
  $("acc").textContent=f.acc||""; $("bulb").setAttribute("fill",f.bulb);
  const h=$("head"); h.classList.remove("shake","tilt","droop"); void h.getBBox(); if(f.anim) h.classList.add(f.anim);
  $("moodEn").textContent=f.en; $("moodTe").textContent=f.te;
  document.querySelectorAll("#faces button").forEach(b=>b.classList.toggle("on",b.dataset.f===current));
}

const OPEN=F("M111 150a9 7 0 1 0 18 0a9 7 0 1 0 -18 0z");
function startTalk(){ if(talkTimer) return; let o=false;
  talkTimer=setInterval(()=>{o=!o;paint($("mouth"),o?OPEN:FACES[current].mouth)},150); }
function stopTalk(){ clearInterval(talkTimer); talkTimer=null; clearTimeout(talkStop); paint($("mouth"),FACES[current].mouth); }
function fakeTalk(text){ startTalk(); clearTimeout(talkStop); talkStop=setTimeout(stopTalk,Math.min(6000,300+text.length*45)); }


const SERVER=(window.SOUL_SERVER||"").replace(/\/+$/,"");
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let device=store.get("sf_device",null); if(!device){device=Math.random().toString(36).slice(2)+Date.now().toString(36);store.set("sf_device",device);}
$("privacy").href=SERVER+"/privacy";

let voiceOn=store.get("sf_voice",true);
function setVoiceBtn(){const b=$("voice");b.setAttribute("aria-pressed",voiceOn);b.textContent=voiceOn?"🔊":"🔇";b.setAttribute("aria-label",voiceOn?"Voice on":"Voice off");}
setVoiceBtn();
function nativeTTS(){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.TextToSpeech;}
async function speak(text){
  const te=/[ఀ-౿]/.test(text);
  if(!voiceOn){fakeTalk(text);return;}
  const TTS=nativeTTS();
  if(TTS){
    startTalk();
    try{ await TTS.stop().catch(()=>{}); await TTS.speak({text,lang:te?"te-IN":"en-IN",rate:1.0,pitch:1.3,volume:1.0,category:"ambient"}); }
    catch(e){ fakeTalk(text); return; }
    stopTalk(); return;
  }
  if(!("speechSynthesis" in window)){fakeTalk(text);return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=te?"te-IN":"en-IN"; u.pitch=1.35; u.rate=1;
    const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith(te?"te":"en-in")); if(v) u.voice=v;
    let started=false; u.onstart=()=>{started=true;startTalk()}; u.onend=stopTalk; u.onerror=stopTalk;
    speechSynthesis.speak(u); setTimeout(()=>{if(!started) fakeTalk(text);},1200);
  }catch(e){fakeTalk(text);}
}
function hush(){try{nativeTTS()&&nativeTTS().stop()}catch(e){} try{speechSynthesis.cancel()}catch(e){} stopTalk();}
$("voice").onclick=()=>{voiceOn=!voiceOn;store.set("sf_voice",voiceOn);setVoiceBtn();if(!voiceOn)hush();};

let lang=store.get("sf_lang","auto");
function setLangBtns(){document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lang===lang));}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("sf_lang",lang);setLangBtns();});
setLangBtns();

const facesBox=$("faces");
Object.entries(FACES).forEach(([k,f])=>{const b=document.createElement("button");b.type="button";b.dataset.f=k;b.textContent=f.en+" · "+f.te;b.onclick=()=>{setFace(k);fakeTalk("hello there");};facesBox.append(b);});

const log=$("log");
function bubble(cls,text){const d=document.createElement("div");d.className="b "+cls;d.textContent=text;log.append(d);log.scrollTop=log.scrollHeight;return d;}
function botBubble(text,question){
  const d=bubble("bot",text);
  const t=document.createElement("span");t.className="tools";
  const r=document.createElement("button");r.type="button";r.className="rep";r.textContent="Report";
  r.onclick=()=>{
    r.remove();
    const box=document.createElement("div");box.className="reasons";
    ["Wrong answer","Offensive","Unsafe","Other"].forEach(reason=>{const b=document.createElement("button");b.type="button";b.textContent=reason;
      b.onclick=async()=>{box.textContent="Sending…";
        try{const res=await fetch(SERVER+"/api/report",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reason,reply:text,question})});
          box.textContent=res.ok?"Reported. Thank you.":"Couldn't send the report. Try again later.";}
        catch(e){box.textContent="Couldn't send the report. Check your internet.";}};
      box.append(b);});
    t.append(box); log.scrollTop=log.scrollHeight;
  };
  t.append(r); d.append(t); return d;
}

let turns=store.get("sf_turns",[]); let busy=false;
function save(){store.set("sf_turns",turns.slice(-30));}

async function send(text){
  text=text.trim(); if(!text||busy) return;
  busy=true; $("send").disabled=true; $("msg").value=""; hush();
  document.querySelector(".sugg")?.remove();
  bubble("me",text); turns.push({role:"user",content:text});
  setFace("thinking");
  const wait=bubble("bot",""); wait.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  try{
    const res=await fetch(SERVER+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:turns.slice(-12),lang,device})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw {msg:data.error||"Something went wrong. Please try again.",status:res.status};
    const reply=String(data.reply||"…"); const emo=FACES[data.emotion]?data.emotion:"happy";
    turns.push({role:"assistant",content:reply}); save();
    wait.remove(); botBubble(reply,text); setFace(emo); speak(reply);
  }catch(e){
    turns.pop(); wait.remove();
    bubble("note",(e&&e.msg)||"No internet connection. Check your network and try again.");
    setFace(e&&e.status===429?"sad":"confused");
  }finally{busy=false;$("send").disabled=false;}
}
$("f").addEventListener("submit",e=>{e.preventDefault();send($("msg").value);});

function greet(){
  bubble("bot","నమస్తే! Hi! I'm Soul Friend. I can translate, explain words, fix grammar, or help you write a message in Telugu or English. Try one of these:");
  const sg=document.createElement("div"); sg.className="sugg";
  ["Translate: నేను రేపు ఆఫీసుకి రాలేను","Write a polite leave request in English","ఈ రోజు నాకు చాలా బోర్ గా ఉంది","Explain 'empathy' in Telugu"].forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=()=>send(t);sg.append(b);});
  log.append(sg);
}
$("clear").onclick=()=>{hush();turns=[];save();log.innerHTML="";greet();setFace("happy");};

setFace("happy");
if(turns.length){ let q=""; turns.forEach(m=>{ if(m.role==="user"){q=m.content;bubble("me",m.content);} else botBubble(m.content,q); }); bubble("note","Welcome back!"); }
else greet();
</script>
</body>
</html>
