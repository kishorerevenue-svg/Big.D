name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the test app (APK)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Build the phone APK and Play Store AAB (signed with your stamp)
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No KEYSTORE_BASE64 secret yet, skipping signed builds."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/BigD-AI.apk
      # Same stamp every time, so each new APK installs over the old one.
      - uses: actions/upload-artifact@v4
        with:
          name: bigd-ai-phone-apk
          path: android/app/build/outputs/apk/release/BigD-AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bigd-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
