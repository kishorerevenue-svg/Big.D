name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # to publish the Lite APK as a public download (one-tap updates)
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the test apps (Lite and Full)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Build the phone APKs and Play Store AAB (signed with your stamp)
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No KEYSTORE_BASE64 secret yet, skipping signed builds."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew assembleLiteRelease assembleFullRelease bundleFullRelease assemblePlusRelease bundlePlusRelease --no-daemon
          cp app/build/outputs/apk/lite/release/app-lite-release.apk app/build/outputs/apk/lite/release/Habit-AI-Lite.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk app/build/outputs/apk/full/release/Habit-AI-Full.apk
          cp app/build/outputs/apk/plus/release/app-plus-release.apk app/build/outputs/apk/plus/release/Habit-AI-Plus.apk
      # Habit Brain: the optional tiny brain for no internet (a separate app, 64-bit phones). If it can't be built,
      # everything else still goes out.
      - name: Build Habit Brain (the tiny brain for no internet)
        continue-on-error: true
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No KEYSTORE_BASE64 secret yet, skipping."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew :brain:assembleRelease --no-daemon
          cp brain/build/outputs/apk/release/brain-release.apk brain/build/outputs/apk/release/Habit-Brain.apk
          ls -la brain/build/outputs/apk/release/Habit-Brain.apk
      # Stops the build if the Lite APK ever gets one of the four permissions that make
      # Play Protect block sideloaded apps in India (SMS reading, notification access, Accessibility).
      - name: Check the Lite APK is safe to share on WhatsApp
        run: |
          lite=app/build/outputs/apk/lite/release/Habit-AI-Lite.apk
          full=app/build/outputs/apk/full/release/Habit-AI-Full.apk
          if [ ! -f "$lite" ]; then echo "No signed APKs to check."; exit 0; fi
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          for apk in "$lite" "$full"; do
            "$aapt2" dump badging "$apk" | grep -E "^(package|application-label):" | sed "s|^|::notice title=$(basename "$apk")::|"
          done
          "$aapt2" dump xmltree --file AndroidManifest.xml "$lite" > "$RUNNER_TEMP/lite-manifest.txt"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$full" > "$RUNNER_TEMP/full-manifest.txt"
          plus=app/build/outputs/apk/plus/release/Habit-AI-Plus.apk
          "$aapt2" dump xmltree --file AndroidManifest.xml "$plus" > "$RUNNER_TEMP/plus-manifest.txt"
          # The first Play Store upload (Full) must not have Accessibility: only Plus has it.
          if grep -q BIND_ACCESSIBILITY_SERVICE "$RUNNER_TEMP/full-manifest.txt"; then
            echo "::error::Habit-AI-Full has Hands-free control (Accessibility). Keep it in src/plus only."
            exit 1
          fi
          if grep -q BIND_ACCESSIBILITY_SERVICE "$RUNNER_TEMP/plus-manifest.txt"; then
            echo "::notice title=Habit-AI-Plus.apk::Hands-free control (Accessibility) is included."
          else
            echo "::warning title=Habit-AI-Plus.apk::Hands-free control (Accessibility) is missing."
          fi
          grep -q "E: manifest" "$RUNNER_TEMP/lite-manifest.txt"
          blocked='READ_SMS|RECEIVE_SMS|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE'
          if grep -Eo "$blocked" "$RUNNER_TEMP/lite-manifest.txt"; then
            echo "::error::Habit-AI-Lite.apk has a permission that Play Protect blocks in India. Keep it out of src/main/AndroidManifest.xml."
            exit 1
          fi
          echo "::notice title=Habit-AI-Lite.apk::None of the four permissions Play Protect blocks in India."
          if grep -q BIND_NOTIFICATION_LISTENER_SERVICE "$RUNNER_TEMP/full-manifest.txt"; then
            echo "::notice title=Habit-AI-Full.apk::Reply to messages (notification access) is included."
          else
            echo "::warning title=Habit-AI-Full.apk::Reply to messages (notification access) is missing."
          fi
      # One-tap updates: each Lite build from the main branch becomes a public download (a GitHub release).
      # The app asks the server (bigdai.tech/app/latest) for it, and bigdai.tech/download always gives the newest.
      - name: Publish the Lite APK for one-tap updates
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lite=app/build/outputs/apk/lite/release/Habit-AI-Lite.apk
          if [ ! -f "$lite" ]; then echo "No signed Lite APK, nothing to publish."; exit 0; fi
          tag="lite-v1.0.$VERSION_CODE"
          git log -1 --pretty=%s > "$RUNNER_TEMP/notes.txt"
          brain=brain/build/outputs/apk/release/Habit-Brain.apk
          files="$lite"; [ -f "$brain" ] && files="$lite $brain"
          gh release create "$tag" $files --title "Habit AI Lite 1.0.$VERSION_CODE" --notes-file "$RUNNER_TEMP/notes.txt" --latest
          echo "::notice title=Download::https://github.com/${{ github.repository }}/releases/download/$tag/Habit-AI-Lite.apk"
          # keep only the 5 newest Lite downloads
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^lite-v' | tail -n +6 | while read -r old; do
            gh release delete "$old" --cleanup-tag --yes || true
          done
      # Same stamp every time, so each new APK installs over the old one.
      # Lite: share this one on WhatsApp. It has no "Reply to messages", so Play Protect lets it install.
      - uses: actions/upload-artifact@v4
        with:
          name: bigd-ai-lite-apk
          path: android/app/build/outputs/apk/lite/release/Habit-AI-Lite.apk
      # Habit Brain: the optional tiny brain (works with Habit AI Lite).
      - uses: actions/upload-artifact@v4
        with:
          name: bigd-brain-apk
          path: android/brain/build/outputs/apk/release/Habit-Brain.apk
          if-no-files-found: ignore
      # Full: every feature, for your own testing. Play Protect blocks it when it is opened from WhatsApp.
      - uses: actions/upload-artifact@v4
        with:
          name: bigd-ai-full-apk
          path: android/app/build/outputs/apk/full/release/Habit-AI-Full.apk
      # Plus: Full + Hands-free control. Play Protect blocks it when sideloaded in India:
      # test it through Play Console internal testing, or install with a computer (adb).
      - uses: actions/upload-artifact@v4
        with:
          name: bigd-ai-plus-apk
          path: android/app/build/outputs/apk/plus/release/Habit-AI-Plus.apk
      # Upload this instead of the Full AAB once the Accessibility declaration is ready.
      - uses: actions/upload-artifact@v4
        with:
          name: bigd-play-store-plus-aab
          path: android/app/build/outputs/bundle/plusRelease/app-plus-release.aab
          if-no-files-found: ignore
      # Play Store upload (full edition).
      - uses: actions/upload-artifact@v4
        with:
          name: bigd-play-store-aab
          path: android/app/build/outputs/bundle/fullRelease/app-full-release.aab
          if-no-files-found: ignore
