name: Screens

# Screenshots of Habit Chat's look (dark and light) on an Android emulator, from a test build filled with
# made-up sample chats. Runs for branches named ui-…, or by hand. The pictures are in the "screens" artifact.
on:
  push:
    branches: [ "ui-*" ]
  workflow_dispatch:

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the test app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLiteDebug --no-daemon
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take the screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: android/shots
          if-no-files-found: ignore
