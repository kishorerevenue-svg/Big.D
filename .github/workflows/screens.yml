name: Screens

# Screenshots of Habit Chat's look (dark and light) on an Android emulator, from a test build filled with
# made-up sample chats. Runs for branches named ui-…, or by hand. The pictures are in the "screens" artifact.
on:
  push:
    branches: [ "ui-*" ]
  workflow_dispatch:

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write      # to put the pictures on the ui-shots branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the test app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLiteDebug --no-daemon
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take the screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: android/shots
          if-no-files-found: ignore
      # The same pictures on a branch of their own (ui-shots), so they can be looked at with plain git.
      - name: Put the screenshots on the ui-shots branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd android/shots 2>/dev/null || exit 0
          git init -q -b ui-shots .
          git config user.name "Habit AI screenshots"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-shots
